<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<html>
<head>
  <meta charset="UTF-8">
  <title>My Favorite Movies</title>
</head>
<!-- Three rows: menu on top, three movie frames in the middle, contact details at the bottom -->
<frameset rows="20%,60%,20%" border="2">
  <frame src="menu.html" name="menu" scrolling="no">
  <frameset cols="33%,34%,33%">
    <frame src="placeholder1.html" name="movie1">
    <frame src="placeholder2.html" name="movie2">
    <frame src="placeholder3.html" name="movie3">
  </frameset>
  <frame src="footer.html" name="footer" scrolling="no">
  <noframes>
    <body>Your browser does not support frames.</body>
  </noframes>
</frameset>
</html>
